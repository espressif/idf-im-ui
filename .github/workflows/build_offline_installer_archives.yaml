name: Build & Upload Offline Installer Archives

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      run_id:
        required: true
        type: string
      idf_version:
        required: false
        type: string
        description: "Specific IDF version (e.g. v5.1.2). Empty = build all."
      debug:
        required: false
        type: boolean
        default: false
        description: "Debug: uploads to debug/ prefix, skips JSON update & purge."
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      DL_DISTRIBUTION_ID:
        required: true

  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID to take binaries from (blank = auto-detect latest release)"
        required: false
        type: string
      idf_version:
        description: "Specific IDF version (e.g. v5.1.2). Leave blank for all."
        required: false
        type: string
      purge_all:
        description: "Purge all existing archives for the built versions from S3 (DANGEROUS)"
        required: false
        type: boolean
        default: false
      debug:
        description: "Debug: uploads to debug/ prefix, skips JSON update & purge."
        required: false
        type: boolean
        default: false

concurrency:
  group: offline-installer-build
  cancel-in-progress: false

permissions:
  contents: read

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Resolve versions & run_id ──────────────────────────────────────────
  get-versions:
    name: "🔍 Resolve Versions & Run ID"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      versions:         ${{ steps.get-versions.outputs.versions }}
      version_count:    ${{ steps.get-versions.outputs.version_count }}
      should_purge:     ${{ steps.get-versions.outputs.should_purge }}
      debug:            ${{ steps.get-versions.outputs.debug }}
      staging_prefix:   ${{ steps.get-versions.outputs.staging_prefix }}
      resolved_run_id:  ${{ steps.resolve-run-id.outputs.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ── Resolve the source run_id ──────────────────────────────────────────
      - name: Resolve run_id
        id: resolve-run-id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.run_id }}" ]; then
            echo "run_id=${{ inputs.run_id }}" >> $GITHUB_OUTPUT
            echo "✅ Using provided run_id: ${{ inputs.run_id }}"
          else
            echo "ℹ️ No run_id provided — finding latest successful release run of 'Unified Build Workflow'..."

            WORKFLOW_ID=$(gh api \
              "/repos/${{ github.repository }}/actions/workflows" \
              --jq '.workflows[] | select(.name == "Unified Build Workflow") | .id')
            echo "Workflow ID: $WORKFLOW_ID"

            RUN_ID=$(gh api \
              "/repos/${{ github.repository }}/actions/workflows/${WORKFLOW_ID}/runs?event=release&status=completed&per_page=10" \
              --jq '[.workflow_runs[] | select(.display_title | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | first | .id')

            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
              echo "::error::Could not find a successful release run of 'Unified Build Workflow'"
              exit 1
            fi

            echo "✅ Auto-resolved run_id: $RUN_ID"
            echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          fi

      # ── Download builder binary (needed only to list versions) ─────────────
      - name: Download offline_installer_builder (linux-x64)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download ${{ steps.resolve-run-id.outputs.run_id }} \
            --repo ${{ github.repository }} \
            --pattern "offline_installer_builder-linux-x64-*" \
            --dir ./downloaded

          echo "--- Downloaded files ---"
          find ./downloaded -type f

          # gh creates a subdirectory per artifact, flatten it
          find ./downloaded -type f -name "offline_installer_builder" -exec cp {} ./ \;

      - name: Make binary executable
        run: chmod +x ./offline_installer_builder

      - name: Install UV
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "src-tauri/Cargo.lock"
          cache-suffix: ${{ inputs.idf_version }}

      # ── Compute versions & flags ───────────────────────────────────────────
      - name: Get IDF versions
        id: get-versions
        run: |
          DEBUG="${{ inputs.debug }}"
          echo "debug=$DEBUG" >> $GITHUB_OUTPUT
          echo "staging_prefix=release-staging/${{ github.run_id }}/" >> $GITHUB_OUTPUT

          # Purge logic
          if [ "$DEBUG" = "true" ]; then
            echo "should_purge=false" >> $GITHUB_OUTPUT
          else
            if [ "${{ github.event_name }}" = "release" ] || [ "${{ inputs.purge_all }}" = "true" ]; then
              echo "should_purge=true" >> $GITHUB_OUTPUT
            else
              echo "should_purge=false" >> $GITHUB_OUTPUT
            fi
          fi

          # Versions list
          if [ -n "${{ inputs.idf_version }}" ]; then
            VERSIONS='["${{ inputs.idf_version }}"]'
            echo "📌 Building specific version: ${{ inputs.idf_version }}"
          else
            echo "📋 Fetching available IDF versions..."
            VERSIONS_OUTPUT=$(./offline_installer_builder --list-versions)
            echo "$VERSIONS_OUTPUT"
            VERSIONS=$(echo "$VERSIONS_OUTPUT" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi

          COUNT=$(echo "$VERSIONS" | jq 'length')
          echo "🔢 Will build $COUNT version(s): $VERSIONS"

          echo "versions=$VERSIONS"       >> $GITHUB_OUTPUT
          echo "version_count=$COUNT"     >> $GITHUB_OUTPUT

      # ── Initial dashboard entry in the run summary ─────────────────────────
      - name: Write initial run summary
        run: |
          VERSIONS='${{ steps.get-versions.outputs.versions }}'
          DEBUG="${{ steps.get-versions.outputs.debug }}"
          PURGE="${{ steps.get-versions.outputs.should_purge }}"
          RUN_ID="${{ steps.resolve-run-id.outputs.run_id }}"
          STAGING="${{ steps.get-versions.outputs.staging_prefix }}"

          echo "# 🏗️ Offline Installer Build Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Source Run ID | \`$RUN_ID\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Debug mode | $( [ "$DEBUG" = "true" ] && echo "⚠️ Yes (uploads to \`debug/\`)" || echo "No") |" >> $GITHUB_STEP_SUMMARY
          echo "| Purge old archives | $( [ "$PURGE" = "true" ] && echo "🗑️ Yes" || echo "No") |" >> $GITHUB_STEP_SUMMARY
          echo "| Staging prefix | \`dl/eim/${STAGING}\` (atomic publish target) |" >> $GITHUB_STEP_SUMMARY
          echo "| Versions to build | \`$(echo $VERSIONS | jq -r 'join(", ")')\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Platforms per version | linux-x64, linux-aarch64, windows-x64, macos-aarch64, macos-x64 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ⏳ Versions are processed **sequentially** (one at a time) to avoid rate limiting." >> $GITHUB_STEP_SUMMARY
          echo "> Platforms within each version build **in parallel**." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 🛡️  Archives are uploaded to the staging prefix and only moved to their canonical S3 keys once every platform's build-info is collected and verified. The new \`offline_archives.json\` is published last, so its size entries can never point at a stale object." >> $GITHUB_STEP_SUMMARY

  # ── 2. Build versions one at a time ───────────────────────────────────────
  #
  # max-parallel: 1  ← THE KEY CHANGE: versions are serialised.
  # continue-on-error: true ← a failed version doesn't cancel subsequent ones.
  # ──────────────────────────────────────────────────────────────────────────
  build-version:
    name: "📦 IDF ${{ matrix.idf_version }}"
    needs: get-versions
    strategy:
      fail-fast: false          # version N+1 still runs even if version N failed
      max-parallel: 1           # ← serialise: no concurrent version builds
      matrix:
        idf_version: ${{ fromJson(needs.get-versions.outputs.versions) }}
    uses: ./.github/workflows/build_single_offline_installer_version.yml
    with:
      idf_version:      ${{ matrix.idf_version }}
      resolved_run_id:  ${{ needs.get-versions.outputs.resolved_run_id }}
      staging_prefix:   ${{ needs.get-versions.outputs.staging_prefix }}
      debug:            ${{ needs.get-versions.outputs.debug }}
      ref:              ${{ inputs.ref || github.ref }}
    secrets:
      AWS_ACCESS_KEY_ID:      ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY:  ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      DL_DISTRIBUTION_ID:     ${{ secrets.DL_DISTRIBUTION_ID }}

  # ── 3. Update offline_archives.json ───────────────────────────────────────
  update-json:
    name: "📝 Update offline_archives.json"
    needs: [get-versions, build-version]
    # Runs even in debug mode: staged archives still need to be promoted to
    # their (debug/) canonical keys and the staging prefix still needs to be
    # cleaned up. Only the JSON publish and purge sub-steps below skip debug.
    if: |
      always() &&
      !contains(needs.build-version.result, 'cancelled')
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-east-1

      - name: Download current offline_archives.json from S3
        if: needs.get-versions.outputs.debug != 'true'
        run: |
          aws s3 cp s3://espdldata/dl/eim/offline_archives.json ./offline_archives.json 2>/dev/null \
            || echo "[]" > ./offline_archives.json
          if ! jq -e 'type == "array"' ./offline_archives.json >/dev/null 2>&1; then
            echo "[]" > ./offline_archives.json
          fi
          echo "📥 Current JSON has $(jq length ./offline_archives.json) entries."

      - name: Download all build-infos
        uses: actions/download-artifact@v8
        with:
          pattern: build-info-*
          path: ./all-build-infos/

      - name: Promote staged archives to canonical S3 keys
        id: promote
        shell: bash
        env:
          STAGING_PREFIX: ${{ needs.get-versions.outputs.staging_prefix }}
        run: |
          set -euo pipefail

          BUCKET="espdldata"
          BASE_DIR="dl/eim"
          STAGED_DIR="${BASE_DIR}/${STAGING_PREFIX}"
          PROMOTE_LOG="promote.log"
          : > "$PROMOTE_LOG"

          PROMOTED=0
          VERIFIED=0
          FAILED=0

          while IFS= read -r -d '' info_file; do
            [ -f "$info_file" ] || continue
            jq empty "$info_file" 2>/dev/null || continue
            status=$(jq -r '.status' "$info_file")
            [ "$status" = "success" ] || continue

            # staged_key is relative to ${BASE_DIR} (e.g.
            # "release-staging/<run_id>/archive_<v>_<p>.zst") because the
            # platform job uploads to s3://${BUCKET}/${BASE_DIR}/${staged_key}.
            staged_key=$(jq -r '.staged_key // empty' "$info_file")
            canonical=$(jq -r '.filename // empty'      "$info_file")
            expected_size=$(jq -r '.size'               "$info_file")

            if [ -z "$staged_key" ] || [ -z "$canonical" ]; then
              echo "::error::build-info missing staged_key/filename: $info_file" | tee -a "$PROMOTE_LOG"
              FAILED=$((FAILED+1))
              continue
            fi

            staged_uri="s3://${BUCKET}/${BASE_DIR}/${staged_key}"
            canonical_uri="s3://${BUCKET}/${BASE_DIR}/${canonical}"

            echo ""
            echo "▶️  Promoting ${staged_key} → ${canonical}" | tee -a "$PROMOTE_LOG"

            # aws s3 mv is a server-side COPY + DELETE on a single key. For an
            # existing destination, S3 overwrites it; for a new key it just
            # renames. This avoids any window where both old and new are
            # missing from the canonical prefix.
            #
            # --metadata-directive REPLACE is required so the new ContentType
            # (application/zstd) is applied: by default the S3 copy preserves
            # the source object's metadata and silently drops the
            # --content-type we set. We don't carry any user metadata today,
            # so REPLACE is safe; if that changes we'll need to re-supply
            # the relevant headers via --metadata here.
            if ! aws s3 mv \
                "${staged_uri}" \
                "${canonical_uri}" \
                --acl=public-read \
                --content-type="application/zstd" \
                --metadata-directive REPLACE 2>&1 | tee -a "$PROMOTE_LOG"; then
              echo "::error::Failed to promote ${staged_uri} → ${canonical_uri}" | tee -a "$PROMOTE_LOG"
              FAILED=$((FAILED+1))
              continue
            fi
            PROMOTED=$((PROMOTED+1))

            # Belt-and-braces: confirm the canonical object is now served as
            # application/zstd. If the directive had been silently ignored the
            # copy would still succeed but CloudFront/browser downloads would
            # detect the wrong type for the archive.
            actual_type=$(aws s3api head-object \
                --bucket "${BUCKET}" \
                --key "${BASE_DIR}/${canonical}" \
                --query 'ContentType' \
                --output text 2>/dev/null || echo "")
            if [ "$actual_type" != "application/zstd" ]; then
              echo "::error::ContentType for ${canonical} is '${actual_type}', expected 'application/zstd'" | tee -a "$PROMOTE_LOG"
              FAILED=$((FAILED+1))
              continue
            fi

            # Verify the canonical object exists and matches the expected size.
            actual_size=$(aws s3api head-object \
                --bucket "${BUCKET}" \
                --key "${BASE_DIR}/${canonical}" \
                --query 'ContentLength' \
                --output text 2>/dev/null || echo "")
            if [ -z "$actual_size" ] || [ "$actual_size" != "$expected_size" ]; then
              echo "::error::Size mismatch for ${canonical}: expected ${expected_size}, got ${actual_size}" | tee -a "$PROMOTE_LOG"
              FAILED=$((FAILED+1))
              continue
            fi
            VERIFIED=$((VERIFIED+1))
            echo "  ✅ Verified ${canonical} (${actual_size} bytes, ${actual_type})" | tee -a "$PROMOTE_LOG"

            # Also move the matching .log file if it was staged alongside the archive.
            staged_log="${staged_key%.zst}.log"
            canonical_log="${canonical%.zst}.log"
            staged_log_uri="s3://${BUCKET}/${BASE_DIR}/${staged_log}"
            canonical_log_uri="s3://${BUCKET}/${BASE_DIR}/${canonical_log}"
            if aws s3api head-object --bucket "${BUCKET}" --key "${BASE_DIR}/${staged_log}" >/dev/null 2>&1; then
              aws s3 mv \
                "${staged_log_uri}" \
                "${canonical_log_uri}" \
                --acl=public-read \
                --content-type="text/plain" \
                --metadata-directive REPLACE >/dev/null 2>&1 || true
            fi
          done < <(find all-build-infos -name "build-info.json" -type f -print0)

          echo ""
          echo "Promoted:  ${PROMOTED}" | tee -a "$PROMOTE_LOG"
          echo "Verified:  ${VERIFIED}" | tee -a "$PROMOTE_LOG"
          echo "Failed:    ${FAILED}"   | tee -a "$PROMOTE_LOG"

          if [ "$PROMOTED" -eq 0 ]; then
            echo "::error::No archives were promoted — refusing to publish JSON." | tee -a "$PROMOTE_LOG"
            exit 1
          fi
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::${FAILED} promote(s) failed — refusing to publish JSON." | tee -a "$PROMOTE_LOG"
            exit 1
          fi

          {
            echo "## 🚚 Promote Results"
            echo ""
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| Promoted | ${PROMOTED} |"
            echo "| Size verified | ${VERIFIED} |"
            echo "| Failed | ${FAILED} |"
            echo "| Staging prefix | \`${STAGED_DIR}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Purge obsolete archives ─────────────────────────────────────────────
      # Runs only after promote has succeeded (the job would already have
      # exited above otherwise), so a promote failure never deletes canonical
      # archives that offline_archives.json still references.
      - name: Purge unsupported archives from S3
        if: needs.get-versions.outputs.should_purge == 'true'
        shell: bash
        run: |
          set -euo pipefail

          BUCKET="espdldata"
          PREFIX="dl/eim/archive_"

          # Build allowed set from successful build-infos only
          declare -A ALLOWED
          while IFS= read -r -d '' info_file; do
            [ -f "$info_file" ] || continue
            jq empty "$info_file" 2>/dev/null || continue
            status=$(jq -r '.status' "$info_file")
            [ "$status" = "success" ] || continue
            filename=$(jq -r '.filename' "$info_file")
            if [ -n "$filename" ] && [ "$filename" != "null" ]; then
              ALLOWED["$filename"]=1
              echo "  ✅ Allowed: $filename"
            fi
          done < <(find all-build-infos -name "build-info.json" -type f -print0)

          echo ""
          echo "Total allowed archives: ${#ALLOWED[@]}"

          S3_OBJECTS=$(aws s3api list-objects-v2 \
            --bucket "${BUCKET}" \
            --prefix "${PREFIX}" \
            --query 'Contents[?ends_with(Key, `.zst`)].[Key,Size]' \
            --output text 2>&1) || {
              echo "::warning::Failed to list S3 objects."
              S3_OBJECTS=""
            }

          touch old_files.txt
          DELETED=0; KEPT=0

          if [ -n "${S3_OBJECTS}" ]; then
            while IFS=$'\t' read -r key size; do
              [ -z "${key}" ] && continue
              filename=$(basename "$key")
              if [ -z "${ALLOWED[$filename]+x}" ]; then
                echo "  🗑️  Deleting: ${key} (${size} bytes)"
                if aws s3 rm "s3://${BUCKET}/${key}"; then
                  echo "$filename" >> old_files.txt
                  DELETED=$((DELETED+1))
                  log_key="${key%.zst}.log"
                  aws s3 rm "s3://${BUCKET}/${log_key}" 2>/dev/null \
                    || echo "::warning::No log to delete at ${log_key}"
                else
                  echo "::warning::Failed to delete ${key}"
                fi
              else
                echo "  ✅ Keeping: ${key}"
                KEPT=$((KEPT+1))
              fi
            done <<< "${S3_OBJECTS}"
          fi

          {
            echo "## 🗑️ Purge Results"
            echo ""
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| Deleted | ${DELETED} |"
            echo "| Kept | ${KEPT} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Merge JSON ──────────────────────────────────────────────────────────
      - name: Merge and upload updated JSON
        if: needs.get-versions.outputs.debug != 'true'
        shell: bash
        run: |
          # Collect only successful entries
          NEW_ENTRIES="[]"
          while IFS= read -r -d '' info_file; do
            [ -f "$info_file" ] || continue
            jq empty "$info_file" 2>/dev/null || continue
            status=$(jq -r '.status' "$info_file")
            [ "$status" = "success" ] || continue
            entry=$(cat "$info_file" | jq 'del(.staged_key)')
            NEW_ENTRIES=$(echo "$NEW_ENTRIES" | jq --argjson e "$entry" '. + [$e]')
          done < <(find all-build-infos -name "build-info.json" -type f -print0)

          echo "📊 New/updated entries: $(echo "$NEW_ENTRIES" | jq length)"

          CURRENT=$(cat offline_archives.json)

          # Remove entries for files that were purged
          if [ -f old_files.txt ] && [ -s old_files.txt ]; then
            OLD_FILENAMES=$(jq -R -s -c 'split("\n") | map(select(length > 0))' old_files.txt)
            CURRENT=$(echo "$CURRENT" | jq --argjson old "$OLD_FILENAMES" \
              'map(select(.filename as $f | ($old | index($f)) | not))')
          fi

          # Merge: replace entries for (version, platform) pairs present in new
          UPDATED=$(echo "$CURRENT" | jq --argjson new "$NEW_ENTRIES" '
            . as $current |
            ($new | map({version, platform})) as $to_replace |
            (
              $current | map(select(
                (.version + "-" + .platform) as $key |
                ($to_replace | map(.version + "-" + .platform) | index($key)) | not
              ))
            ) + $new
          ')

          echo "$UPDATED" > updated_offline_archives.json

          if ! jq empty updated_offline_archives.json; then
            echo "::error::Produced invalid JSON — aborting upload!"
            exit 1
          fi

          TOTAL=$(jq length updated_offline_archives.json)
          echo "📤 Uploading JSON with $TOTAL entries..."

          aws s3 cp --acl=public-read \
            updated_offline_archives.json \
            s3://espdldata/dl/eim/offline_archives.json

          # CloudFront invalidation
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.DL_DISTRIBUTION_ID }} \
            --paths "/dl/eim/offline_archives.json" "/dl/eim/archive_*.zst"

          {
            echo "## 📝 offline_archives.json Updated"
            echo ""
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| New/updated entries | $(echo "$NEW_ENTRIES" | jq length) |"
            echo "| Total entries in JSON | ${TOTAL} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Runs regardless of whether promote/merge succeeded so a failed or
      # partial promotion never leaves this run's staged objects orphaned in
      # S3 (the promote step's log/summary already captured what happened
      # before any of it is removed here).
      - name: Clean up staging prefix for this run
        if: always()
        shell: bash
        env:
          STAGING_PREFIX: ${{ needs.get-versions.outputs.staging_prefix }}
        run: |
          set -euo pipefail
          BUCKET="espdldata"
          # Refuse to run if the prefix is missing or doesn't look like a
          # run-specific staging path: an empty value would expand
          # `aws s3 rm s3://${BUCKET}/dl/eim/${STAGED_DIR} --recursive` to a
          # recursive delete of the canonical archive prefix.
          if [ -z "${STAGING_PREFIX}" ] || [ "${STAGING_PREFIX}" = "/" ]; then
            echo "::warning::staging_prefix is empty — skipping cleanup to avoid deleting canonical keys."
            exit 0
          fi
          case "${STAGING_PREFIX}" in
            release-staging/*/) ;;
            *) echo "::error::Unexpected staging_prefix '${STAGING_PREFIX}' — refusing to delete."; exit 1 ;;
          esac
          STAGED_DIR="dl/eim/${STAGING_PREFIX}"

          echo "🧹 Cleaning up staging prefix s3://${BUCKET}/${STAGED_DIR}"
          aws s3 rm "s3://${BUCKET}/${STAGED_DIR}" --recursive || true
  # ── 4. Final dashboard ─────────────────────────────────────────────────────
  dashboard:
    name: "📊 Pipeline Dashboard"
    needs: [get-versions, build-version, update-json, count-successes]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download all build-infos
        uses: actions/download-artifact@v8
        with:
          pattern: build-info-*
          path: ./all-build-infos/
        continue-on-error: true

      - name: Generate dashboard
        shell: bash
        run: |
          echo "# 🏗️ Offline Installer Build — Final Dashboard" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** \`${{ github.event_name }}\` | **Ref:** \`${{ inputs.ref || github.ref }}\` | **Run:** [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          PLATFORMS="linux-x64 linux-aarch64 windows-x64 macos-aarch64 macos-x64"
          VERSIONS='${{ needs.get-versions.outputs.versions }}'
          VERSION_LIST=$(echo "$VERSIONS" | jq -r '.[]')

          TOTAL=0; SUCCESS=0; FAILURE=0; TOTAL_SIZE=0

          # Build a result map from downloaded artifacts
          declare -A STATUS_MAP
          declare -A SIZE_MAP
          while IFS= read -r -d '' f; do
            [ -f "$f" ] || continue
            jq empty "$f" 2>/dev/null || continue
            v=$(jq -r '.version'  "$f")
            p=$(jq -r '.platform' "$f")
            s=$(jq -r '.status'   "$f")
            sz=$(jq -r '.size'    "$f")
            STATUS_MAP["${v}::${p}"]="$s"
            SIZE_MAP["${v}::${p}"]="$sz"
          done < <(find all-build-infos -name "build-info.json" -type f -print0)

          # ── Matrix table ───────────────────────────────────────────────────
          echo "## 🗂️ Build Matrix" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Header
          HEADER="| Version |"
          DIVIDER="|---------|"
          for P in $PLATFORMS; do
            HEADER="$HEADER $P |"
            DIVIDER="$DIVIDER:---:|"
          done
          echo "$HEADER" >> $GITHUB_STEP_SUMMARY
          echo "$DIVIDER" >> $GITHUB_STEP_SUMMARY

          # Rows
          while IFS= read -r V; do
            ROW="| \`$V\` |"
            for P in $PLATFORMS; do
              KEY="${V}::${P}"
              S="${STATUS_MAP[$KEY]:-unknown}"
              SZ="${SIZE_MAP[$KEY]:-0}"
              TOTAL=$((TOTAL+1))

              case "$S" in
                success)
                  ICON="✅"
                  SUCCESS=$((SUCCESS+1))
                  TOTAL_SIZE=$((TOTAL_SIZE+SZ))
                  SZ_MB=$(( SZ / 1048576 ))
                  ROW="$ROW ✅ ${SZ_MB}MB |"
                  ;;
                failure)
                  ICON="❌"
                  FAILURE=$((FAILURE+1))
                  ROW="$ROW ❌ |"
                  ;;
                *)
                  ROW="$ROW ❓ |"
                  ;;
              esac
            done
            echo "$ROW" >> $GITHUB_STEP_SUMMARY
          done <<< "$VERSION_LIST"

          echo "" >> $GITHUB_STEP_SUMMARY

          # ── Aggregate stats ────────────────────────────────────────────────
          TOTAL_MB=$(( TOTAL_SIZE / 1048576 ))

          if   [ $FAILURE -eq 0 ]; then OVERALL="✅ All builds succeeded"
          elif [ $SUCCESS -eq 0 ]; then OVERALL="❌ All builds failed"
          else                          OVERALL="⚠️ Partial success ($SUCCESS/$TOTAL)"
          fi

          echo "## 📈 Aggregate Statistics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Overall status | $OVERALL |" >> $GITHUB_STEP_SUMMARY
          echo "| Total builds | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| Succeeded | $SUCCESS |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed | $FAILURE |" >> $GITHUB_STEP_SUMMARY
          echo "| Total data uploaded | ~${TOTAL_MB} MB |" >> $GITHUB_STEP_SUMMARY
          echo "| JSON updated | ${{ needs.update-json.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Debug mode | ${{ needs.get-versions.outputs.debug }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Purge ran | ${{ needs.get-versions.outputs.should_purge }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Autotest | $( [ "${{ needs.count-successes.outputs.any_success }}" = "true" ] && echo "ran" || echo "⏭ skipped (no archives built)") |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # ── Autotest-skipped notice ───────────────────────────────────────
          if [ "${{ needs.count-successes.outputs.any_success }}" != "true" ]; then
            echo "ℹ️ Autotest was skipped because no archives were built successfully." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # ── Failed builds detail ───────────────────────────────────────────
          if [ $FAILURE -gt 0 ]; then
            echo "## ❌ Failed Builds" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Version | Platform |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|----------|" >> $GITHUB_STEP_SUMMARY
            while IFS= read -r V; do
              for P in $PLATFORMS; do
                KEY="${V}::${P}"
                S="${STATUS_MAP[$KEY]:-unknown}"
                if [ "$S" != "success" ]; then
                  echo "| \`$V\` | \`$P\` |" >> $GITHUB_STEP_SUMMARY
                fi
              done
            done <<< "$VERSION_LIST"
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> 💡 Download the \`build-log-*\` artifacts above for detailed error output." >> $GITHUB_STEP_SUMMARY
          fi

          # ── Next steps hint ────────────────────────────────────────────────
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Useful Links" >> $GITHUB_STEP_SUMMARY
          echo "- [S3 bucket (dl/eim)](https://s3.console.aws.amazon.com/s3/buckets/espdldata?prefix=dl/eim/)" >> $GITHUB_STEP_SUMMARY
          echo "- [offline_archives.json](https://dl.espressif.com/dl/eim/offline_archives.json)" >> $GITHUB_STEP_SUMMARY
          echo "- [This run's artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

          # ── Fail the job if all builds failed (makes the overall run red) ──
          if [ $SUCCESS -eq 0 ] && [ $TOTAL -gt 0 ]; then
            echo "::error::All $TOTAL builds failed — marking pipeline as failed."
            exit 1
          fi

  # ── 5. Count successful builds ─────────────────────────────────────────────
  #
  # Counts build-info artifacts with status="success" across every version
  # matrix entry. Used to gate downstream jobs (autotest) so they don't run
  # when nothing was actually built — there's nothing to test otherwise.
  # ──────────────────────────────────────────────────────────────────────────
  count-successes:
    name: "🔢 Count Successful Builds"
    needs: [get-versions, build-version]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      success_count: ${{ steps.count.outputs.success_count }}
      failure_count: ${{ steps.count.outputs.failure_count }}
      any_success:   ${{ steps.count.outputs.any_success }}
    steps:
      - name: Download all build-infos
        uses: actions/download-artifact@v8
        with:
          pattern: build-info-*
          path: ./all-build-infos/

      - name: Count successful builds
        id: count
        shell: bash
        run: |
          SUCCESS=0
          FAILURE=0
          while IFS= read -r -d '' f; do
            [ -f "$f" ] || continue
            jq empty "$f" 2>/dev/null || continue
            status=$(jq -r '.status' "$f")
            case "$status" in
              success) SUCCESS=$((SUCCESS+1)) ;;
              failure) FAILURE=$((FAILURE+1)) ;;
            esac
          done < <(find all-build-infos -name "build-info.json" -type f -print0)

          echo "📊 success=$SUCCESS failure=$FAILURE"
          echo "success_count=$SUCCESS" >> "$GITHUB_OUTPUT"
          echo "failure_count=$FAILURE" >> "$GITHUB_OUTPUT"
          if [ "$SUCCESS" -gt 0 ]; then
            echo "any_success=true" >> "$GITHUB_OUTPUT"
          else
            echo "any_success=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 6. Autotest ────────────────────────────────────────────────────────────
  #
  # Only run if at least one archive was built successfully; otherwise the
  # test_offline workflow would download non-existent artifacts and produce
  # meaningless results.
  # ──────────────────────────────────────────────────────────────────────────
  autotest:
    name: "🧪 Autotest Offline Archives"
    needs: [get-versions, build-version, count-successes, update-json]
    if: |
      !cancelled() &&
      needs.count-successes.outputs.any_success == 'true'
    uses: ./.github/workflows/test_offline.yml
    with:
      ref:               ${{ inputs.ref || github.ref }}
      build_info_run_id: ${{ github.run_id }}
      eim_cli_run_id:    ${{ needs.get-versions.outputs.resolved_run_id }}
