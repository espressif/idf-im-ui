name: Publish dl page
# The dl page (dl_page/index.html) is a static SPA that fetches the latest
# release info from S3 / eim_unified_release.json (uploaded by the
# `update-release-info` job in build.yaml) and lists every release asset.
# It distinguishes between the IDE-friendly (non-version-named) and the
# version-named variants so users can pick the one they need.
on:
  release:
    types:
      - created
  push:
    branches:
      - master
      - release/*
    paths:
      - "dl_page/**"
      - ".github/workflows/dl_page.yaml"
  workflow_dispatch:

jobs:
  build-and-deploy-dl-page:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Publish the dl page
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DL_DISTRIBUTION_ID: ${{ secrets.DL_DISTRIBUTION_ID }}
          AWS_DEFAULT_REGION: ap-east-1
        run: |
          # The page itself is a static file; release assets are loaded
          # client-side from eim_unified_release.json (uploaded by build.yaml).
          aws s3 cp --acl=public-read "./dl_page/index.html" s3://espdldata/dl/eim/index.html
          # Invalidate Cache
          aws cloudfront create-invalidation --distribution-id ${DL_DISTRIBUTION_ID} --paths "/dl/eim/index.html"
